name: Feature request
description: Propose a new animation, option or capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The behavior you want
      description: What should the animation do? What is the use case?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How you imagine it
      description: A config option, a component, a method on YumEater, or an API change.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
